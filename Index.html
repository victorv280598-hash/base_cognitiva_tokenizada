<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Cognitiva Tokenizada</title>
  <style>
    /* =========================================================================
       ESTILOS MINIMALISTAS (CSS PURO - SIN DEPENDENCIAS EXTERNAS)
       ========================================================================= */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 4px 0; color: var(--accent); }
    .meta-info { font-size: 0.85rem; color: var(--muted); }
    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .item-id {
      font-weight: 700;
      color: var(--accent);
    }
    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--text);
    }
    .syntax-block {
      display: block;
      background: #020617;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #7dd3fc;
      margin: 8px 0;
      overflow-x: auto;
    }
    .item-detail {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin: 0;
    }
    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="titulo-proyecto">base_cognitiva_tokenizada</h1>
      <div id="estado-carga" class="meta-info">Cargando datos desde GitHub...</div>
    </header>

    <!-- Filtro de texto directo sobre los registros del JSON -->
    <input
      type="text"
      id="filtro-texto"
      class="search-box"
      placeholder="Filtrar por ID, tipo, nombre, sintaxis o detalle..."
      oninput="filtrarRegistros()"
    >

    <!-- Contenedor donde se renderizan los registros tal como están en el JSON -->
    <main id="lista-registros"></main>

    <footer>
      Autor: Victor Jose Vazquez Preciado | Todos los derechos reservados.
    </footer>
  </div>

  <script>
    /* =========================================================================
       1. PARÁMETRO DE CONEXIÓN AL REPOSITORIO
       ========================================================================= */
    const URL_JSON_GITHUB = "https://raw.githubusercontent.com/victorv280598-hash/base_cognitiva_tokenizada/main/base_cognitiva_tokenizada.json";

    // Almacén en memoria de los registros leídos del JSON
    let registrosOriginales = [];

    /* =========================================================================
       2. LECTURA DIRECTA DEL ARCHIVO JSON
       ========================================================================= */
    async function cargarDatos() {
      const estado = document.getElementById("estado-carga");
      try {
        const respuesta = await fetch(URL_JSON_GITHUB);
        if (!respuesta.ok) throw new Error("Error HTTP " + respuesta.status);

        const datos = await respuesta.json();
        const conceptos = datos.conceptos_aislados || {};

        // Convertimos el objeto JSON en una lista ordenada de registros sin alterar sus campos
        registrosOriginales = Object.entries(conceptos).map(([id, contenido]) => ({
          id: id,
          tipo: contenido.tipo || "",
          nombre: contenido.nombre || "",
          sintaxis: contenido.sintaxis || "",
          detalle: contenido.detalle || ""
        }));

        estado.textContent = `Registros cargados: ${registrosOriginales.length}`;
        renderizarRegistros(registrosOriginales);
      } catch (error) {
        estado.textContent = "No se pudo cargar base_cognitiva_tokenizada.json. Verifica que el repositorio sea público.";
      }
    }

    /* =========================================================================
       3. RENDERIZADO Y FILTRO DE TEXTO SIMPLE
       ========================================================================= */
    function renderizarRegistros(lista) {
      const contenedor = document.getElementById("lista-registros");

      if (lista.length === 0) {
        contenedor.innerHTML = '<div class="meta-info">No hay registros que coincidan con el filtro.</div>';
        return;
      }

      contenedor.innerHTML = lista.map(item => `
        <article class="item-card">
          <div class="item-header">
            <span class="item-id">${item.id}</span>
            <span>${item.tipo}</span>
          </div>
          <h2 class="item-title">${item.nombre}</h2>
          <code class="syntax-block">${item.sintaxis}</code>
          <p class="item-detail">${item.detalle}</p>
        </article>
      `).join("");
    }

    function filtrarRegistros() {
      const termino = document.getElementById("filtro-texto").value.toLowerCase().trim();
      if (!termino) {
        renderizarRegistros(registrosOriginales);
        return;
      }

      const filtrados = registrosOriginales.filter(item =>
        item.id.toLowerCase().includes(termino) ||
        item.tipo.toLowerCase().includes(termino) ||
        item.nombre.toLowerCase().includes(termino) ||
        item.sintaxis.toLowerCase().includes(termino) ||
        item.detalle.toLowerCase().includes(termino)
      );

      renderizarRegistros(filtrados);
    }

    // Iniciar carga al abrir la página
    cargarDatos();
  </script>
</body>
</html>
